<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Светофор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="swetofor">
            <div class="circle green"></div>
            <div class="circle"></div>
            <div class="circle red forwards"></div>
        </div>

        <div class="swetofor">
            <div class="circle green"></div>
            <div class="circle"></div>
            <div class="circle red backwards"></div>
        </div>

        <div class="swetofor">
            <div class="circle green"></div>
            <div class="circle"></div>
            <div class="circle red both"></div>
        </div>
    </div>
</body>
</html>
